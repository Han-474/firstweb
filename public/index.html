<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 河南师范大学教务网络管理系统</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-brand">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
      <div class="auth-brand-content">
        <div class="brand-logo">
          <div class="emblem">河师大</div>
          <div>
            <h1>河南师范大学</h1>
            <p>HENAN NORMAL UNIVERSITY</p>
          </div>
        </div>
        <h2>教务网络管理系统</h2>
        <p class="lead">一站式教学服务，选课、成绩、报名、评教尽在掌握。博学笃行，求真创新。</p>
        <div class="auth-features">
          <div class="feat"><span class="dot">📚</span> 网上选课与课程表查询</div>
          <div class="feat"><span class="dot">📊</span> 成绩查询与学业分析</div>
          <div class="feat"><span class="dot">📝</span> 考试报名与活动报名</div>
          <div class="feat"><span class="dot">⭐</span> 教学评价与通知公告</div>
        </div>
      </div>
      <div class="auth-motto">明德 · 正学 · 倡和 · 出新</div>
    </div>

    <div class="auth-form-panel">
      <div class="auth-card">
        <h3>欢迎登录</h3>
        <p class="sub">请使用学号 / 工号 / 管理员账号登录系统</p>

        <div class="role-tabs" id="roleTabs">
          <button class="role-tab active" data-role="student">学生</button>
          <button class="role-tab" data-role="teacher">教师</button>
          <button class="role-tab" data-role="admin">管理员</button>
        </div>

        <div class="auth-error" id="authError"></div>

        <div class="field">
          <label>账号</label>
          <div class="input-wrap">
            <span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
            <input id="username" type="text" placeholder="请输入账号" autocomplete="username" />
          </div>
        </div>
        <div class="field">
          <label>密码</label>
          <div class="input-wrap">
            <span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
            <input id="password" type="password" placeholder="请输入密码" autocomplete="current-password" />
          </div>
        </div>

        <button class="btn-primary" id="loginBtn">登 录</button>

        <div class="demo-tip">
          <p>演示账号（点击快速填充）</p>
          <div class="demo-btns">
            <button class="demo-btn" data-u="2023012345" data-p="123456" data-role="student"><span>👨‍🎓 学生账号</span><b>2023012345 / 123456</b></button>
            <button class="demo-btn" data-u="10101" data-p="123456" data-role="teacher"><span>👨‍🏫 教师账号</span><b>10101 / 123456</b></button>
            <button class="demo-btn" data-u="admin" data-p="admin123" data-role="admin"><span>🛠️ 管理员账号</span><b>admin / admin123</b></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    if (window.App && window.App.initLogin) window.App.initLogin();
  </script>
</body>
</html>
