<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>河南师范大学教务网络管理系统</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app" id="app">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="emblem">河师大</div>
        <div class="t">教务处<small>EDU ADMIN SYSTEM</small></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div class="sidebar-user">
          <div class="avatar" id="sbAvatar">张</div>
          <div class="meta">
            <div class="nm" id="sbName">—</div>
            <div class="rl" id="sbRole">—</div>
          </div>
          <button class="btn-logout" id="logoutBtn" title="退出登录">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- 主区域 -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="page-title" id="pageTitle">工作台<small>Dashboard</small></div>
        <div class="topbar-right">
          <div class="search-box">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="globalSearch" type="text" placeholder="搜索功能、课程、通知…" />
          </div>
          <button class="icon-btn" id="bellBtn" title="通知">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="dot-count" id="bellCount">3</span>
          </button>
        </div>
      </header>
      <main class="content" id="content"></main>
    </div>
  </div>

  <div class="overlay" id="overlay" style="display:none" onclick="window.App.closeSidebar()"></div>
  <div class="toast-wrap" id="toastWrap"></div>
  <div id="modalRoot"></div>

  <script src="/js/app.js"></script>
  <script>window.App.initApp();</script>
</body>
</html>
